name: smart_parking_project
description: SmartParking — تطبيق إدارة مواقف السيارات الذكي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  url_launcher: ^6.2.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.0
  http: ^1.2.0
  # Firebase
  firebase_core:         ^3.1.0
  firebase_auth:         ^5.1.0
  cloud_firestore:       ^5.1.0

  # الخريطة
  flutter_map:           ^7.0.0
  latlong2:              ^0.9.0

  # الموقع الجغرافي
  geolocator:            ^13.0.0

  # الأيقونات
  font_awesome_flutter:  ^10.7.0

  # متفرقات
  cupertino_icons:       ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
